quarkus.azure-functions.app-name=feedback-platform-fgfiap
quarkus.azure-functions.runtime.java-version=21
quarkus.azure-functions.resource-group=rg-feedback
quarkus.azure-functions.region=brazilsouth

# ---------- Banco de dados ----------
quarkus.datasource.db-kind=postgresql

# prod (Azure): valores vêm de variáveis de ambiente;
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# O esquema de produção é criado uma vez com db/schema.sql
quarkus.hibernate-orm.database.generation=none
%dev.quarkus.hibernate-orm.database.generation=update
%test.quarkus.hibernate-orm.database.generation=drop-and-create